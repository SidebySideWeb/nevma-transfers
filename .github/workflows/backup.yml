# Weekly encrypted Sanity + Postgres backups → Cloudflare R2 (prompt 13 / ARCHITECTURE §9).
#
# DATABASE_URL must be the Supabase *session pooler* URI (IPv4). The direct
# database host is IPv6-only; GitHub-hosted runners cannot reach it.
#
# Repository secrets (never commit values):
#   SANITY_AUTH_TOKEN, SANITY_PROJECT_ID, SANITY_DATASET,
#   DATABASE_URL, AGE_RECIPIENT,
#   BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT,
#   BACKUP_AWS_ACCESS_KEY_ID, BACKUP_AWS_SECRET_ACCESS_KEY,
#   HEALTHCHECK_URL
# Repository variable:
#   BACKUP_PREFIX  — e.g. "transfers"
name: Backups

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backups
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release age
          # supabase/config.toml major_version = 17; noble's default client is older.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Runner images also ship client 16 on PATH; force 17 ahead of it.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'
          age --version
          aws --version

      - name: Export and encrypt
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          STAMP=$(date -u +%Y%m%d)
          mkdir -p backup-out

          echo "Exporting Sanity dataset (assets + drafts; token not logged)…"
          # Pin to the same major.minor as apps/studio (sanity ^6.21.0).
          npx --yes sanity@6.21.0 dataset export "$SANITY_DATASET" \
            "backup-out/sanity-${STAMP}.tar.gz" \
            --project "$SANITY_PROJECT_ID"
          ENTRIES=$(tar -tzf "backup-out/sanity-${STAMP}.tar.gz" | wc -l)
          if [ "$ENTRIES" -lt 1 ]; then
            echo "Sanity archive is empty" >&2
            exit 1
          fi
          echo "Sanity archive entries: ${ENTRIES}"

          echo "Dumping Postgres public schema (custom format)…"
          pg_dump --version
          pg_dump --format=custom --no-owner --no-acl --schema=public \
            --file="backup-out/postgres-${STAMP}.dump" "$DATABASE_URL"
          LIST_LINES=$(pg_restore --list "backup-out/postgres-${STAMP}.dump" | wc -l)
          if [ "$LIST_LINES" -lt 1 ]; then
            echo "Postgres dump TOC is empty" >&2
            exit 1
          fi
          echo "Postgres dump TOC lines: ${LIST_LINES}"

          echo "Encrypting with age…"
          age -r "$AGE_RECIPIENT" -o "backup-out/sanity-${STAMP}.tar.gz.age" \
            "backup-out/sanity-${STAMP}.tar.gz"
          age -r "$AGE_RECIPIENT" -o "backup-out/postgres-${STAMP}.dump.age" \
            "backup-out/postgres-${STAMP}.dump"
          rm -f "backup-out/sanity-${STAMP}.tar.gz" "backup-out/postgres-${STAMP}.dump"

          echo "Encrypted files (names and sizes only):"
          ls -la backup-out

      - name: Upload to Cloudflare R2
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          : "${BACKUP_S3_BUCKET:?}"
          : "${BACKUP_S3_ENDPOINT:?}"
          : "${BACKUP_PREFIX:?}"

          STAMP=$(date -u +%Y%m%d)
          YEAR_WEEK=$(date -u +%G-W%V)
          YEAR_MONTH=$(date -u +%Y-%m)
          DOM=$(date -u +%-d)

          WEEKLY="s3://${BACKUP_S3_BUCKET}/${BACKUP_PREFIX}/weekly/${YEAR_WEEK}"
          echo "Uploading to ${WEEKLY}/ …"
          aws s3 cp backup-out/ "${WEEKLY}/" --recursive \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto

          # R2 often rejects s3api head-object; list the object instead.
          assert_object() {
            local uri="$1"
            local line size
            line=$(aws s3 ls "$uri" --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto) || {
              echo "Missing object: ${uri}" >&2
              exit 1
            }
            size=$(printf '%s\n' "$line" | awk '{print $3}')
            if [ -z "$size" ] || [ "$size" -le 0 ]; then
              echo "Empty object: ${uri}" >&2
              exit 1
            fi
            echo "OK ${uri##*/} (${size} bytes)"
          }

          EXPECTED=(
            "sanity-${STAMP}.tar.gz.age"
            "postgres-${STAMP}.dump.age"
          )
          for f in "${EXPECTED[@]}"; do
            assert_object "${WEEKLY}/${f}"
          done

          if [ "$DOM" -le 7 ]; then
            MONTHLY="s3://${BACKUP_S3_BUCKET}/${BACKUP_PREFIX}/monthly/${YEAR_MONTH}"
            echo "First-week-of-month run: copying to ${MONTHLY}/ …"
            aws s3 cp backup-out/ "${MONTHLY}/" --recursive \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto
            for f in "${EXPECTED[@]}"; do
              assert_object "${MONTHLY}/${f}"
            done
          fi

          echo "Retention: keep 8 weekly, 12 monthly (deletes may fail under object lock)…"
          # aws s3 ls exits 1 when a prefix is empty — tolerate that for retention only.
          prune_old() {
            local prefix="$1"
            local keep="$2"
            local listing
            listing=$(aws s3 ls "s3://${BACKUP_S3_BUCKET}/${BACKUP_PREFIX}/${prefix}/" \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto || true)
            printf '%s\n' "$listing" | awk '/PRE / {print $2}' | sed 's|/$||' | sort -r \
              | tail -n "+$((keep + 1))" | while read -r d; do
                [ -z "$d" ] && continue
                aws s3 rm "s3://${BACKUP_S3_BUCKET}/${BACKUP_PREFIX}/${prefix}/${d}/" \
                  --recursive --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto || true
              done
          }
          prune_old weekly 8
          prune_old monthly 12

      - name: Healthcheck success
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 "$HEALTHCHECK_URL"

      - name: Healthcheck fail
        if: failure()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 "${HEALTHCHECK_URL}/fail" || true

      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Backup failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'The weekly Sanity + Postgres backup workflow failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Do not paste secrets into this issue. Check Actions logs and storage credentials.',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure',
            });
            if (issues.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['backup-failure'],
            });
