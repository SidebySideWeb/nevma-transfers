name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # CI-only throwaway; not a production secret (avoids default "postgres" password scanners).
          POSTGRES_PASSWORD: ci_tem_db_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tem/db test
        env:
          DATABASE_URL: postgres://postgres:ci_tem_db_only@localhost:5432/postgres
      # Web booking/payment/email suites that need Postgres (skipped in the check job).
      - run: pnpm --filter @tem/web test
        env:
          DATABASE_URL: postgres://postgres:ci_tem_db_only@localhost:5432/postgres
          ADMIN_TO_WEB_SIGNING_SECRET: ci-admin-web-signing-secret-32chars
          CRON_SECRET: ci-cron-secret

