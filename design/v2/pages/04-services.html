<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Protection – Services and routes</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0}
html{color-scheme: dark; accent-color: #CFA45F}
*{-webkit-tap-highlight-color: transparent}
::selection{background: #CFA45F; color: #0A0A0B}
a{color:#E7C687}a:hover{color:#F4F0E6}
:focus-visible{outline: 2px solid #E7C687; outline-offset: 3px}
.eyebrow{font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:#E7C687;font-weight:500}
.display{font-family:'Playfair Display',serif;font-weight:500;line-height:1.04;letter-spacing:-0.01em;margin:0}
.display em{font-style:italic;color:#E7C687}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 30px;box-sizing:border-box;font-family:'Jost',sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid #E7C687;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease}
.btn-gold{background:#E7C687;color:#0A0A0B}
.btn-gold:hover{background:#F2DDAE;color:#0A0A0B;transform:translateY(-2px);box-shadow:0 12px 32px rgba(231,198,135,.3)}
.btn-line{background:rgba(10,10,11,.2);color:#E7C687}
.btn-line:hover{background:#E7C687;color:#0A0A0B}
.link-arrow{color:#E7C687;text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-bottom:1px solid rgba(207,164,95,.5);padding-bottom:5px;transition:border-color .2s,color .2s}
.link-arrow:hover{color:#F4F0E6;border-color:#F4F0E6}
.nav{display:flex;gap:6px 34px;flex-wrap:wrap}
.nav a{color:#F4F0E6;text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:10px 0;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.nav a:hover,.nav a.on{color:#E7C687;border-color:#CFA45F}
.card{transition:transform .35s ease,border-color .35s ease}
.card:hover{transform:translateY(-4px);border-color:#CFA45F !important}
.zoom{overflow:hidden}
.zoom .ph{transition:transform .9s ease}
.zoom:hover .ph{transform:scale(1.05)}
.tab{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:64px;padding:0 4px 0 0;background:transparent;border:0;border-bottom:1px solid rgba(207,164,95,.25);font-family:'Playfair Display',serif;font-size:26px;color:#8E887B;cursor:pointer;text-align:left;transition:color .2s}
.tab:hover{color:#F4F0E6}
.burger{display:none}
.field{display:flex;flex-direction:column;gap:4px;padding:14px 18px;box-sizing:border-box;border-right:1px solid rgba(207,164,95,.22)}
.field label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#B9A281}
.field input{background:transparent;border:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:17px;padding:0;height:30px;width:100%}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:30px;background:transparent;border:0;padding:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:17px;text-align:left;cursor:pointer}
.dd-opt{display:flex;width:100%;box-sizing:border-box;align-items:center;min-height:46px;padding:0 16px;background:transparent;border:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:16px;text-align:left;cursor:pointer}
.dd-opt:hover,.dd-opt:focus-visible{background:#E7C687;color:#0A0A0B;outline:none}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid rgba(207,164,95,.6);background:#0A0A0B;color:#E7C687;font-size:18px;cursor:pointer;transition:transform .3s ease,background .2s}
.swap:hover{transform:rotate(180deg);background:#15181A}
.mm a{color:#F4F0E6;text-decoration:none;font-family:'Playfair Display',serif;font-size:34px;padding:10px 0;border-bottom:1px solid rgba(207,164,95,.25)}
@media (max-width: 960px){.nav{display:none !important}.burger{display:inline-flex !important}.hide-m{display:none !important}.field{border-right:0;border-bottom:1px solid rgba(207,164,95,.22)}.display.xl{font-size:56px !important}}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;min-height:72px;background:transparent;border:0;border-top:1px solid rgba(207,164,95,.3);padding:0;color:#F4F0E6;font-family:'Playfair Display',serif;font-size:24px;text-align:left;cursor:pointer;transition:color .2s}
.faq-q:hover{color:#E7C687}
.rate{display:flex;flex-direction:column;padding:14px 20px;border:1px solid rgba(207,164,95,.3);min-width:120px}

.bgx1{background:linear-gradient(90deg, rgba(7,7,8,0.95) 0%, rgba(7,7,8,0.7) 45%, rgba(7,7,8,0.2) 100%), linear-gradient(0deg, #0A0A0B 0%, rgba(10,10,11,0) 35%), url(images/v-class-dash.jpg) center 60%/cover no-repeat}
.bgx2{background:url(images/s-class-terminal.jpg) center/cover no-repeat}
.bgx3{background:linear-gradient(90deg, rgba(7,7,8,0.96) 0%, rgba(7,7,8,0.8) 55%, rgba(7,7,8,0.55) 100%), url(images/v-class-marina.jpg) center/cover no-repeat}
</style>
<script src="assets/runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="background: #0A0A0B; color: #F4F0E6; font-family: 'Jost', sans-serif; font-size: 17px; line-height: 1.65; overflow-x: hidden;">
  <section class="bgx1" style="position: relative; min-height: 720px; display: flex; flex-direction: column;">
    <header style="position: relative; z-index: 20; border-bottom: 1px solid rgba(207,164,95,0.22);">
      <div style="max-width: 1320px; margin: 0 auto; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
        <a href="01-home.html" aria-label="Elite Protection home" style="display: inline-flex; align-items: center; text-decoration: none;"><img src="images/logo-white.png" alt="Elite Protection" style="height: 52px; width: auto; display: block;"></a>
        <nav class="nav" aria-label="Main">
          <a href="02-fleet.html">Fleet</a>
          <a class="on" aria-current="page" href="04-services.html">Services</a>
          <a href="05-vip-security.html">VIP Security</a>
          <a href="06-about.html">About</a>
          <a href="07-contact.html">Contact</a>
        </nav>
        <div style="display: flex; align-items: center; gap: 22px;">
          <a class="hide-m" href="tel:+302109706967" style="color: #E7C687; text-decoration: none; font-size: 15px; letter-spacing: 0.06em;">+30 210 970 6967</a>
          <a class="btn btn-gold hide-m" href="08-book.html" style="min-height: 46px; padding: 0 22px;">Book</a>
          <button type="button" class="burger" onClick="{{toggleNav}}" aria-label="Menu" aria-expanded="{{navOpen}}" style="width: 46px; height: 46px; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(207,164,95,0.6); color: #E7C687; font-size: 20px; cursor: pointer;">☰</button>
        </div>
      </div>
    </header>

    <template data-sc="if" value="{{navOpen}}" hint-placeholder-val="{{false}}">
      <div class="mm" style="position: fixed; z-index: 60; inset: 0; overflow-y: auto; background: #0A0A0B; padding: 28px 32px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <span class="eyebrow">Menu</span>
          <button type="button" onClick="{{toggleNav}}" aria-label="Close menu" style="width: 46px; height: 46px; background: transparent; border: 1px solid rgba(207,164,95,0.6); color: #E7C687; font-size: 20px; cursor: pointer;">✕</button>
        </div>
        <a href="02-fleet.html">Fleet</a><a href="04-services.html">Services</a><a href="05-vip-security.html">VIP Security</a><a href="06-about.html">About</a><a href="07-contact.html">Contact</a>
        <a class="btn btn-gold" href="08-book.html" style="margin-top: 28px; font-family: 'Jost', sans-serif; font-size: 13px; border: 1px solid #E7C687; color: #0A0A0B;">Book a transfer</a>
      </div>
    </template>


    <div style="position: relative; z-index: 2; flex: 1; max-width: 1320px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 100px 32px 80px; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px;">
      <div class="eyebrow">VIP Transfer / Services &amp; routes</div>
      <h1 class="display xl" style="font-size: 88px; max-width: 860px;">Transfers for <em>every itinerary.</em></h1>
      <p style="margin: 0; max-width: 560px; font-size: 19px; font-weight: 300; color: #D9D3C4;">From a single airport run to a full day at your disposal, with or without a security escort.</p>
    </div>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 110px 32px 60px;">
    <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 52px; max-width: 700px;">
      <div class="eyebrow">Booking options</div>
      <h2 class="display" style="font-size: 56px;">Choose <em>how you travel</em></h2>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
      <template data-sc="for" list="{{options}}" as="o" hint-placeholder-count="4">
        <div class="card" style="flex: 1 1 260px; border: 1px solid rgba(207,164,95,0.3); background: #111315; padding: 34px 30px; display: flex; flex-direction: column; gap: 14px;">
          <span style="font-family: 'Playfair Display', serif; font-style: italic; font-size: 44px; line-height: 1; color: #CFA45F;">{{o.n}}</span>
          <h3 style="margin: 0; font-size: 21px; font-weight: 500;">{{o.title}}</h3>
          <p style="margin: 0; color: #A9A395; font-size: 16px;">{{o.text}}</p>
          <span style="margin-top: auto; padding-top: 10px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #E7C687;">{{o.price}}</span>
        </div>
      </template>
    </div>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 60px 32px 100px;">
    <div style="position: relative; border: 1px solid #CFA45F; overflow: hidden; display: flex; flex-wrap: wrap;">
      <div class="bgx2" style="flex: 1 1 440px; min-height: 420px;" role="img" aria-label="S-Class at the airport terminal"></div>
      <div style="flex: 1 1 520px; padding: 48px; display: flex; flex-direction: column; gap: 18px; background: linear-gradient(180deg, #121416, #0A0A0B);">
        <div class="eyebrow">Featured route · airport transfer</div>
        <h2 class="display" style="font-size: 44px;">Athens International <em>↔</em> Athens</h2>
        <p style="margin: 0; color: #B8B2A4;">One-way journeys between AIA and Athens, with luggage assistance and your chauffeur waiting on arrival.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
          <template data-sc="for" list="{{rates}}" as="r" hint-placeholder-count="5">
            <div class="rate"><span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #B9A281;">{{r.name}}</span><span style="font-family: 'Playfair Display', serif; font-size: 28px; color: #E7C687;">{{r.price}}</span></div>
          </template>
        </div>
        <div style="font-size: 13px; color: #8E887B;">Prices in euros, exclusive of 24% VAT. Other zones: <a href="12-request-transfer.html">request a quote</a>.</div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px;">
          <a class="btn btn-gold" href="08-book.html">Book this route</a>
          <a class="btn btn-line" href="02-fleet.html">Full price list</a>
        </div>
      </div>
    </div>
  </section>

  <section style="background: #0F1112; border-top: 1px solid rgba(207,164,95,0.2); border-bottom: 1px solid rgba(207,164,95,0.2);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 110px 32px;">
      <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 52px;">
        <div class="eyebrow">Where we take you</div>
        <h2 class="display" style="font-size: 52px;">For every <em>occasion</em></h2>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 24px;">
        <template data-sc="for" list="{{uses}}" as="u" hint-placeholder-count="3">
          <div class="card zoom" style="flex: 1 1 340px; border: 1px solid rgba(207,164,95,0.3); background: #0A0A0B; display: flex; flex-direction: column;">
            <div style="position: relative; height: 260px; overflow: hidden;"><img class="ph" src="{{u.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #050505;"></div>
            <div style="padding: 28px; display: flex; flex-direction: column; gap: 10px;">
              <span style="font-family: 'Playfair Display', serif; font-style: italic; color: #CFA45F;">{{u.n}}</span>
              <h3 class="display" style="font-size: 28px;">{{u.title}}</h3>
              <p style="margin: 0; color: #A9A395; font-size: 16px;">{{u.text}}</p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 110px 32px 120px; display: flex; flex-wrap: wrap; gap: 56px;">
    <div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px;">
      <div class="eyebrow">Good to know</div>
      <h2 class="display" style="font-size: 52px;">Questions, <em>answered</em></h2>
      <p style="margin: 0; color: #A9A395;">Anything else? Call us any time on <a href="tel:+302109706967">+30 210 970 6967</a>.</p>
    </div>
    <div style="flex: 2 1 600px; display: flex; flex-direction: column; border-bottom: 1px solid rgba(207,164,95,0.3);">
      <template data-sc="for" list="{{faq}}" as="q" hint-placeholder-count="5">
        <div>
          <button type="button" class="faq-q" aria-expanded="{{q.open}}" onClick="{{q.toggle}}"><span>{{q.q}}</span><span aria-hidden="true" style="flex: 0 0 auto; width: 36px; height: 36px; border: 1px solid rgba(207,164,95,0.6); display: flex; align-items: center; justify-content: center; color: #CFA45F; font-family: 'Jost', sans-serif; font-size: 20px;">{{q.sign}}</span></button>
          <template data-sc="if" value="{{q.isOpen}}" hint-placeholder-val="{{false}}"><p style="margin: 0 0 26px; max-width: 680px; color: #B8B2A4;">{{q.a}}</p></template>
        </div>
      </template>
    </div>
  </section>

  <section class="bgx3" style="position: relative;  border-top: 1px solid rgba(207,164,95,0.3);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 110px 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between;">
      <h2 class="display" style="font-size: 56px; max-width: 640px;">Something tailored <em>to your itinerary?</em></h2>
      <div style="display: flex; flex-wrap: wrap; gap: 14px;">
        <a class="btn btn-line" href="12-request-transfer.html">Request a quote</a>
        <a class="btn btn-gold" href="08-book.html">Book a transfer</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer style="background: #050505; border-top: 1px solid rgba(207,164,95,0.3);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 80px 32px 40px; display: flex; flex-wrap: wrap; gap: 48px;">
      <div style="flex: 2 1 300px; display: flex; flex-direction: column; gap: 18px;">
        <img src="images/logo-white.png" alt="Elite Protection" style="height: 64px; width: auto; display: block; align-self: flex-start;">
        <p style="margin: 0; max-width: 340px; color: #A9A395; font-size: 15px;">VIP Transfer and VIP Security in Athens. Luxury vehicles, professional chauffeurs and security teams, 24/7.</p>
      </div>
      <div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 10px; font-size: 15px;">
        <div class="eyebrow" style="margin-bottom: 6px;">Transfers</div>
        <a href="02-fleet.html" style="color: #D9D3C4; text-decoration: none;">Fleet &amp; rates</a>
        <a href="04-services.html" style="color: #D9D3C4; text-decoration: none;">Services &amp; routes</a>
        <a href="08-book.html" style="color: #D9D3C4; text-decoration: none;">Book a transfer</a>
        <a href="14-find-my-booking.html" style="color: #D9D3C4; text-decoration: none;">Find my booking</a>
      </div>
      <div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 10px; font-size: 15px;">
        <div class="eyebrow" style="margin-bottom: 6px;">Company</div>
        <a href="05-vip-security.html" style="color: #D9D3C4; text-decoration: none;">VIP Security</a>
        <a href="06-about.html" style="color: #D9D3C4; text-decoration: none;">About</a>
        <a href="07-contact.html" style="color: #D9D3C4; text-decoration: none;">Contact</a>
      </div>
      <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; font-size: 15px;">
        <div class="eyebrow" style="margin-bottom: 6px;">24/7</div>
        <a href="tel:+302109706967" style="color: #F4F0E6; text-decoration: none; font-size: 19px;">+30 210 970 6967</a>
        <a href="tel:+306981810410" style="color: #F4F0E6; text-decoration: none; font-size: 19px;">+30 698 181 0410</a>
        <a href="mailto:info@eliteprotection.gr" style="color: #E7C687; text-decoration: none;">info@eliteprotection.gr</a>
      </div>
    </div>
    <div style="max-width: 1320px; margin: 0 auto; padding: 22px 32px 34px; border-top: 1px solid rgba(207,164,95,0.18); display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; font-size: 13px; color: #8E887B;">
      <div>© 2026 Elite Protection · Prices exclusive of 24% VAT</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 22px;"><a href="17-legal.html" style="color: #8E887B; text-decoration: none;">Terms</a><a href="17-legal.html" style="color: #8E887B; text-decoration: none;">Privacy</a><a href="17-legal.html" style="color: #8E887B; text-decoration: none;">Cookies</a></div>
    </div>
  </footer>
</div>
</template>
<script type="text/plain" id="dc-logic">class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const open = st.faq === undefined ? 0 : st.faq;
    const faq = [
      { q: 'Are the prices final?', a: 'Prices are fixed per vehicle and route, quoted in euros and exclusive of 24% VAT. You see the total before you pay.' },
      { q: 'Does the airport rate cover a return journey?', a: 'No. Airport transfer rates apply to one-way journeys between Athens International Airport (AIA) and Athens.' },
      { q: 'What is the minimum for a chauffeur by the hour?', a: 'Minimum booking hours apply to hourly chauffeur services: 4 hours for most vehicles and 3 hours for the E-Class.' },
      { q: 'How long is my vehicle held while I book?', a: 'Once you choose a vehicle it is held for you for 20 minutes while you add your details and pay.' },
      { q: 'Can I add a security escort?', a: 'Yes. Transfers are available with or without security escorts, working to a coordinated plan tailored to your needs.' },
      { q: 'How do I change or cancel a booking?', a: 'Use the secure link in your confirmation email, or find your booking with its reference and email. For changes, call the office.' }
    ];
    return {
      navOpen: !!st.navOpen,
      toggleNav: () => this.setState({ navOpen: !st.navOpen }),
      options: [
        { n: 'i.', title: 'One-off transfer', text: 'A single journey from your pick-up point to your chosen destination.', price: 'From €150' },
        { n: 'ii.', title: 'Transfer with waiting time', text: 'Your chauffeur remains available for your return or onward journey.', price: 'On request' },
        { n: 'iii.', title: 'Hourly chauffeur', text: 'A vehicle and chauffeur at your disposal for meetings and multiple stops.', price: 'From €60 / hour' },
        { n: 'iv.', title: 'Full-day chauffeur', text: 'A dedicated chauffeur and vehicle for your whole itinerary.', price: 'On request' }
      ],
      rates: [{ name: 'V-Class', price: '€180' }, { name: 'Vito', price: '€150' }, { name: 'E-Class', price: '€150' }, { name: 'S-Class', price: '€180' }, { name: 'Sprinter', price: '€180' }],
      uses: [
        { n: '01', img: 'images/chauffeur-hotel.jpg', title: 'Airports, ports & hotels', text: 'Pick-up and transfers to and from arrival points, accommodation and departures.' },
        { n: '02', img: 'images/e-class-int.jpg', title: 'Business & private travel', text: 'Meetings, events, private appointments and journeys with multiple stops.' },
        { n: '03', img: 'images/sprinter-2.jpg', title: 'Groups & delegations', text: 'Scheduled returns, private tours and itineraries for larger parties.' }
      ],
      faq: faq.map((f, i) => ({ q: f.q, a: f.a, isOpen: i === open, open: i === open ? 'true' : 'false', sign: i === open ? '−' : '+', toggle: () => this.setState({ faq: i === open ? -1 : i }) }))
    };
  }
}

</script>
</body>
</html>
