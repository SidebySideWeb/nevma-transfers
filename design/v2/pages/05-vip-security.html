<!doctype html>
<html lang="en">
<head>

<title>Elite Protection – VIP Security</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0}
html{color-scheme: dark; accent-color: #CFA45F}
*{-webkit-tap-highlight-color: transparent}
::selection{background: #CFA45F; color: #0A0A0B}
a{color:#E7C687}a:hover{color:#F4F0E6}
:focus-visible{outline: 2px solid #E7C687; outline-offset: 3px}
.eyebrow{font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:#E7C687;font-weight:500}
.display{font-family:'Playfair Display',serif;font-weight:500;line-height:1.04;letter-spacing:-0.01em;margin:0}
.display em{font-style:italic;color:#E7C687}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 30px;box-sizing:border-box;font-family:'Jost',sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid #E7C687;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease}
.btn-gold{background:#E7C687;color:#0A0A0B}
.btn-gold:hover{background:#F2DDAE;color:#0A0A0B;transform:translateY(-2px);box-shadow:0 12px 32px rgba(231,198,135,.3)}
.btn-line{background:rgba(10,10,11,.2);color:#E7C687}
.btn-line:hover{background:#E7C687;color:#0A0A0B}
.link-arrow{color:#E7C687;text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-bottom:1px solid rgba(207,164,95,.5);padding-bottom:5px;transition:border-color .2s,color .2s}
.link-arrow:hover{color:#F4F0E6;border-color:#F4F0E6}
.nav{display:flex;gap:6px 34px;flex-wrap:wrap}
.nav a{color:#F4F0E6;text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:10px 0;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.nav a:hover,.nav a.on{color:#E7C687;border-color:#CFA45F}
.card{transition:transform .35s ease,border-color .35s ease}
.card:hover{transform:translateY(-4px);border-color:#CFA45F !important}
.zoom{overflow:hidden}
.zoom .ph{transition:transform .9s ease}
.zoom:hover .ph{transform:scale(1.05)}
.tab{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:64px;padding:0 4px 0 0;background:transparent;border:0;border-bottom:1px solid rgba(207,164,95,.25);font-family:'Playfair Display',serif;font-size:26px;color:#8E887B;cursor:pointer;text-align:left;transition:color .2s}
.tab:hover{color:#F4F0E6}
.burger{display:none}
.field{display:flex;flex-direction:column;gap:4px;padding:14px 18px;box-sizing:border-box;border-right:1px solid rgba(207,164,95,.22)}
.field label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#B9A281}
.field input{background:transparent;border:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:17px;padding:0;height:30px;width:100%}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:30px;background:transparent;border:0;padding:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:17px;text-align:left;cursor:pointer}
.dd-opt{display:flex;width:100%;box-sizing:border-box;align-items:center;min-height:46px;padding:0 16px;background:transparent;border:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:16px;text-align:left;cursor:pointer}
.dd-opt:hover,.dd-opt:focus-visible{background:#E7C687;color:#0A0A0B;outline:none}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid rgba(207,164,95,.6);background:#0A0A0B;color:#E7C687;font-size:18px;cursor:pointer;transition:transform .3s ease,background .2s}
.swap:hover{transform:rotate(180deg);background:#15181A}
.mm a{color:#F4F0E6;text-decoration:none;font-family:'Playfair Display',serif;font-size:34px;padding:10px 0;border-bottom:1px solid rgba(207,164,95,.25)}
@media (max-width: 960px){.nav{display:none !important}.burger{display:inline-flex !important}.hide-m{display:none !important}.field{border-right:0;border-bottom:1px solid rgba(207,164,95,.22)}.display.xl{font-size:56px !important}}
.ddl{position:absolute;left:0;right:0;top:100%;margin:2px 0 0;padding:4px 0;list-style:none;background:#15181A;border:1px solid #CFA45F;box-shadow:0 16px 40px rgba(0,0,0,.6);z-index:31}
.grid{display:flex;flex-wrap:wrap;gap:26px 28px}
.f2{flex:1 1 260px;display:flex;flex-direction:column;gap:8px;position:relative}
.f2 label,.lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#B9A281}
.f2 input,.f2 textarea,.f2 .dd-btn{box-sizing:border-box;width:100%;height:50px;background:transparent;border:0;border-bottom:1px solid rgba(207,164,95,.55);color:#F4F0E6;font-family:'Jost',sans-serif;font-size:18px;padding:0;transition:border-color .2s}
.f2 textarea{height:auto;min-height:130px;border:1px solid rgba(207,164,95,.55);padding:14px}
.f2 input:focus,.f2 textarea:focus{outline:none;border-color:#E7C687}
.f2 input::placeholder{color:#5E5A52}

.bgx1{background:linear-gradient(270deg, rgba(7,7,8,0.92) 0%, rgba(7,7,8,0.55) 42%, rgba(7,7,8,0.05) 75%), linear-gradient(0deg, #0A0A0B 0%, rgba(10,10,11,0) 35%), url(images/brand-security-acropolis.jpg) 30% center/cover no-repeat}
.bgx2{background:url(images/chauffeur-door.jpg) center 30%/cover no-repeat}
</style>

<script type="text/plain" id="dc-logic">class Component extends DCLogic {
  dd(k, opts) {
    const st = this.state || {}, cur = st[k + 'V'] || opts[0], o = {};
    o[k + '_value'] = cur; o[k + '_open'] = !!st[k + 'O'];
    o[k + '_toggle'] = () => this.setState({ [k + 'O']: !st[k + 'O'] });
    o[k + '_options'] = opts.map(x => ({ label: x, mark: x === cur ? '✓' : '', pick: () => this.setState({ [k + 'V']: x, [k + 'O']: false }) }));
    return o;
  }
  renderVals() {
    const st = this.state || {};
    return Object.assign({
      navOpen: !!st.navOpen,
      toggleNav: () => this.setState({ navOpen: !st.navOpen }),
      anyOpen: !!st.svcO,
      closeAll: () => this.setState({ svcO: false }),
      principles: [
        { n: 'i.', title: 'Discreet presence', text: 'VIP security escorts that respect your privacy and daily routine.' },
        { n: 'ii.', title: 'Tailored to your needs', text: 'Protection planned around your schedule and the requirements of each occasion.' },
        { n: 'iii.', title: 'Protection on the move', text: 'VIP protection combined with luxury transfers.' }
      ],
      groups: [
        { eyebrow: 'On site', title: 'Guarding & protection', items: [{ t: 'Static guarding for commercial, public and residential premises' }, { t: 'Mobile patrols' }, { t: 'Event security and VIP protection' }] },
        { eyebrow: 'Systems', title: 'Technology & support', items: [{ t: '24-hour alarm and CCTV monitoring through an Alarm Receiving Centre' }, { t: 'Security assessments' }, { t: 'Installation and maintenance of alarm, CCTV and fire detection systems' }] }
      ]
    }, this.dd('svc', ['Close protection / VIP escort', 'Transfer with security escort', 'Event security', 'Static guarding', 'Mobile patrols', 'Alarm, CCTV and fire detection', 'Security assessment']));
  }
}

</script>
