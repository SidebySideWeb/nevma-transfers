<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Protection – About</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0}
html{color-scheme: dark; accent-color: #CFA45F}
*{-webkit-tap-highlight-color: transparent}
::selection{background: #CFA45F; color: #0A0A0B}
a{color:#E7C687}a:hover{color:#F4F0E6}
:focus-visible{outline: 2px solid #E7C687; outline-offset: 3px}
.eyebrow{font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:#E7C687;font-weight:500}
.display{font-family:'Playfair Display',serif;font-weight:500;line-height:1.04;letter-spacing:-0.01em;margin:0}
.display em{font-style:italic;color:#E7C687}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 30px;box-sizing:border-box;font-family:'Jost',sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid #E7C687;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease}
.btn-gold{background:#E7C687;color:#0A0A0B}
.btn-gold:hover{background:#F2DDAE;color:#0A0A0B;transform:translateY(-2px);box-shadow:0 12px 32px rgba(231,198,135,.3)}
.btn-line{background:rgba(10,10,11,.2);color:#E7C687}
.btn-line:hover{background:#E7C687;color:#0A0A0B}
.link-arrow{color:#E7C687;text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-bottom:1px solid rgba(207,164,95,.5);padding-bottom:5px;transition:border-color .2s,color .2s}
.link-arrow:hover{color:#F4F0E6;border-color:#F4F0E6}
.nav{display:flex;gap:6px 34px;flex-wrap:wrap}
.nav a{color:#F4F0E6;text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:10px 0;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.nav a:hover,.nav a.on{color:#E7C687;border-color:#CFA45F}
.card{transition:transform .35s ease,border-color .35s ease}
.card:hover{transform:translateY(-4px);border-color:#CFA45F !important}
.zoom{overflow:hidden}
.zoom .ph{transition:transform .9s ease}
.zoom:hover .ph{transform:scale(1.05)}
.tab{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:64px;padding:0 4px 0 0;background:transparent;border:0;border-bottom:1px solid rgba(207,164,95,.25);font-family:'Playfair Display',serif;font-size:26px;color:#8E887B;cursor:pointer;text-align:left;transition:color .2s}
.tab:hover{color:#F4F0E6}
.burger{display:none}
.field{display:flex;flex-direction:column;gap:4px;padding:14px 18px;box-sizing:border-box;border-right:1px solid rgba(207,164,95,.22)}
.field label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#B9A281}
.field input{background:transparent;border:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:17px;padding:0;height:30px;width:100%}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:30px;background:transparent;border:0;padding:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:17px;text-align:left;cursor:pointer}
.dd-opt{display:flex;width:100%;box-sizing:border-box;align-items:center;min-height:46px;padding:0 16px;background:transparent;border:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:16px;text-align:left;cursor:pointer}
.dd-opt:hover,.dd-opt:focus-visible{background:#E7C687;color:#0A0A0B;outline:none}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid rgba(207,164,95,.6);background:#0A0A0B;color:#E7C687;font-size:18px;cursor:pointer;transition:transform .3s ease,background .2s}
.swap:hover{transform:rotate(180deg);background:#15181A}
.mm a{color:#F4F0E6;text-decoration:none;font-family:'Playfair Display',serif;font-size:34px;padding:10px 0;border-bottom:1px solid rgba(207,164,95,.25)}
@media (max-width: 960px){.nav{display:none !important}.burger{display:inline-flex !important}.hide-m{display:none !important}.field{border-right:0;border-bottom:1px solid rgba(207,164,95,.22)}.display.xl{font-size:56px !important}}

.bgx1{background:linear-gradient(90deg, rgba(7,7,8,0.95) 0%, rgba(7,7,8,0.75) 45%, rgba(7,7,8,0.3) 100%), linear-gradient(0deg, #0A0A0B 0%, rgba(10,10,11,0) 35%), url(images/s-class-dash.jpg) center/cover no-repeat}
.bgx2{background:url(images/chauffeur-hotel.jpg) center/cover no-repeat}
</style>
<script src="assets/runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="background: #0A0A0B; color: #F4F0E6; font-family: 'Jost', sans-serif; font-size: 17px; line-height: 1.65; overflow-x: hidden;">
  <section class="bgx1" style="position: relative; min-height: 720px; display: flex; flex-direction: column;">
    <header style="position: relative; z-index: 20; border-bottom: 1px solid rgba(207,164,95,0.22);">
      <div style="max-width: 1320px; margin: 0 auto; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
        <a href="01-home.html" aria-label="Elite Protection home" style="display: inline-flex; align-items: center; text-decoration: none;"><img src="images/logo-white.png" alt="Elite Protection" style="height: 52px; width: auto; display: block;"></a>
        <nav class="nav" aria-label="Main">
          <a href="02-fleet.html">Fleet</a>
          <a href="04-services.html">Services</a>
          <a href="05-vip-security.html">VIP Security</a>
          <a class="on" aria-current="page" href="06-about.html">About</a>
          <a href="07-contact.html">Contact</a>
        </nav>
        <div style="display: flex; align-items: center; gap: 22px;">
          <a class="hide-m" href="tel:+302109706967" style="color: #E7C687; text-decoration: none; font-size: 15px; letter-spacing: 0.06em;">+30 210 970 6967</a>
          <a class="btn btn-gold hide-m" href="08-book.html" style="min-height: 46px; padding: 0 22px;">Book</a>
          <button type="button" class="burger" onClick="{{toggleNav}}" aria-label="Menu" aria-expanded="{{navOpen}}" style="width: 46px; height: 46px; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(207,164,95,0.6); color: #E7C687; font-size: 20px; cursor: pointer;">☰</button>
        </div>
      </div>
    </header>

    <template data-sc="if" value="{{navOpen}}" hint-placeholder-val="{{false}}">
      <div class="mm" style="position: fixed; z-index: 60; inset: 0; overflow-y: auto; background: #0A0A0B; padding: 28px 32px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <span class="eyebrow">Menu</span>
          <button type="button" onClick="{{toggleNav}}" aria-label="Close menu" style="width: 46px; height: 46px; background: transparent; border: 1px solid rgba(207,164,95,0.6); color: #E7C687; font-size: 20px; cursor: pointer;">✕</button>
        </div>
        <a href="02-fleet.html">Fleet</a><a href="04-services.html">Services</a><a href="05-vip-security.html">VIP Security</a><a href="06-about.html">About</a><a href="07-contact.html">Contact</a>
        <a class="btn btn-gold" href="08-book.html" style="margin-top: 28px; font-family: 'Jost', sans-serif; font-size: 13px; border: 1px solid #E7C687; color: #0A0A0B;">Book a transfer</a>
      </div>
    </template>


    <div style="position: relative; z-index: 2; flex: 1; max-width: 1320px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 100px 32px 80px; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px;">
      <div class="eyebrow">About Elite Protection</div>
      <h1 class="display xl" style="font-size: 88px; max-width: 860px;">Two divisions, <em>one company.</em></h1>
      <p style="margin: 0; max-width: 600px; font-size: 19px; font-weight: 300; color: #D9D3C4;">Based in Athens, Elite Protection provides comprehensive security and VIP transfer services for businesses, organisations and private clients.</p>
    </div>
  </section>

  <section style="border-bottom: 1px solid rgba(207,164,95,0.2); background: #0C0D0E;">
    <div style="max-width: 1320px; margin: 0 auto; padding: 48px 32px; display: flex; flex-wrap: wrap; gap: 32px;">
      <template data-sc="for" list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; border-left: 1px solid rgba(207,164,95,0.5); padding-left: 24px;">
          <span style="font-family: 'Playfair Display', serif; font-size: 52px; line-height: 1; color: #E7C687;">{{s.big}}</span>
          <span style="font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #B9A281;">{{s.label}}</span>
        </div>
      </template>
    </div>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 110px 32px; display: flex; flex-wrap: wrap; gap: 24px;">
    <template data-sc="for" list="{{divisions}}" as="d" hint-placeholder-count="2">
      <a href="{{d.href}}" class="card zoom" style="flex: 1 1 520px; position: relative; min-height: 520px; display: flex; text-decoration: none; color: #F4F0E6; border: 1px solid rgba(207,164,95,0.3);">
        <img class="ph" src="{{d.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
        <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,7,8,0.96) 5%, rgba(7,7,8,0.3) 65%);"></div>
        <div style="position: relative; margin-top: auto; padding: 40px; display: flex; flex-direction: column; gap: 12px;">
          <div class="eyebrow">{{d.eyebrow}}</div>
          <div class="display" style="font-size: 38px;">{{d.title}}</div>
          <div style="color: #D9D3C4; max-width: 480px;">{{d.text}}</div>
          <span class="link-arrow" style="align-self: flex-start; margin-top: 8px;">{{d.cta}}</span>
        </div>
      </a>
    </template>
  </section>

  <section style="background: #0F1112; border-top: 1px solid rgba(207,164,95,0.2); border-bottom: 1px solid rgba(207,164,95,0.2);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 110px 32px; display: flex; flex-wrap: wrap; gap: 64px;">
      <div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px;">
        <div class="eyebrow">Our people</div>
        <h2 class="display" style="font-size: 52px;">People who take <em>personal responsibility</em></h2>
        <p style="margin: 0; color: #A9A395;">Professional security teams and chauffeurs, accountable for every engagement.</p>
      </div>
      <div style="flex: 2 1 560px; display: flex; flex-direction: column;">
        <template data-sc="for" list="{{values}}" as="v" hint-placeholder-count="3">
          <div style="display: flex; gap: 32px; padding: 30px 0; border-top: 1px solid rgba(207,164,95,0.3);">
            <span style="flex: 0 0 56px; font-family: 'Playfair Display', serif; font-style: italic; font-size: 40px; line-height: 1; color: #CFA45F;">{{v.n}}</span>
            <div><div class="display" style="font-size: 28px; margin-bottom: 6px;">{{v.title}}</div><div style="color: #A9A395;">{{v.text}}</div></div>
          </div>
        </template>
      </div>
    </div>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 120px 32px; display: flex; flex-wrap: wrap; gap: 64px; align-items: center;">
    <div class="zoom" style="flex: 1 1 480px; position: relative; min-height: 520px; border: 1px solid rgba(207,164,95,0.3);">
      <div class="bgx2 ph" role="img" aria-label="Chauffeur at a hotel entrance in the evening" style="position: absolute; inset: 0;"></div>
    </div>
    <div style="flex: 1 1 440px; display: flex; flex-direction: column; gap: 20px;">
      <div class="eyebrow">Clients</div>
      <h2 class="display" style="font-size: 52px;">Relationships <em>built on trust</em></h2>
      <p style="margin: 0; color: #B8B2A4;">We serve businesses, public organisations, retail premises, industrial facilities and discerning private clients.</p>
      <p style="margin: 0; color: #B8B2A4;">Absolute confidentiality is a core commitment. Every engagement, and every piece of information, is treated with discretion and respect for our clients’ privacy.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px;">
        <a class="btn btn-gold" href="07-contact.html">Contact us</a>
        <a class="btn btn-line" href="08-book.html">Book a transfer</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer style="background: #050505; border-top: 1px solid rgba(207,164,95,0.3);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 80px 32px 40px; display: flex; flex-wrap: wrap; gap: 48px;">
      <div style="flex: 2 1 300px; display: flex; flex-direction: column; gap: 18px;">
        <img src="images/logo-white.png" alt="Elite Protection" style="height: 64px; width: auto; display: block; align-self: flex-start;">
        <p style="margin: 0; max-width: 340px; color: #A9A395; font-size: 15px;">VIP Transfer and VIP Security in Athens. Luxury vehicles, professional chauffeurs and security teams, 24/7.</p>
      </div>
      <div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 10px; font-size: 15px;">
        <div class="eyebrow" style="margin-bottom: 6px;">Transfers</div>
        <a href="02-fleet.html" style="color: #D9D3C4; text-decoration: none;">Fleet &amp; rates</a>
        <a href="04-services.html" style="color: #D9D3C4; text-decoration: none;">Services &amp; routes</a>
        <a href="08-book.html" style="color: #D9D3C4; text-decoration: none;">Book a transfer</a>
        <a href="14-find-my-booking.html" style="color: #D9D3C4; text-decoration: none;">Find my booking</a>
      </div>
      <div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 10px; font-size: 15px;">
        <div class="eyebrow" style="margin-bottom: 6px;">Company</div>
        <a href="05-vip-security.html" style="color: #D9D3C4; text-decoration: none;">VIP Security</a>
        <a href="06-about.html" style="color: #D9D3C4; text-decoration: none;">About</a>
        <a href="07-contact.html" style="color: #D9D3C4; text-decoration: none;">Contact</a>
      </div>
      <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; font-size: 15px;">
        <div class="eyebrow" style="margin-bottom: 6px;">24/7</div>
        <a href="tel:+302109706967" style="color: #F4F0E6; text-decoration: none; font-size: 19px;">+30 210 970 6967</a>
        <a href="tel:+306981810410" style="color: #F4F0E6; text-decoration: none; font-size: 19px;">+30 698 181 0410</a>
        <a href="mailto:info@eliteprotection.gr" style="color: #E7C687; text-decoration: none;">info@eliteprotection.gr</a>
      </div>
    </div>
    <div style="max-width: 1320px; margin: 0 auto; padding: 22px 32px 34px; border-top: 1px solid rgba(207,164,95,0.18); display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; font-size: 13px; color: #8E887B;">
      <div>© 2026 Elite Protection · Prices exclusive of 24% VAT</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 22px;"><a href="17-legal.html" style="color: #8E887B; text-decoration: none;">Terms</a><a href="17-legal.html" style="color: #8E887B; text-decoration: none;">Privacy</a><a href="17-legal.html" style="color: #8E887B; text-decoration: none;">Cookies</a></div>
    </div>
  </footer>
</div>
</template>
<script type="text/plain" id="dc-logic">class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    return {
      navOpen: !!st.navOpen,
      toggleNav: () => this.setState({ navOpen: !st.navOpen }),
      stats: [{ big: '24/7', label: 'Office and chauffeurs' }, { big: '2', label: 'Divisions, one standard' }, { big: '5', label: 'Mercedes-Benz classes' }, { big: '[year]', label: 'Founded (to be supplied)' }],
      divisions: [
        { href: '05-vip-security.html', img: 'images/brand-security-acropolis.jpg', eyebrow: 'VIP Security', title: 'Protection for people, premises and property', text: 'Static guarding, mobile patrols, event security and VIP protection, with 24-hour alarm and CCTV monitoring.', cta: 'VIP Security →' },
        { href: '02-fleet.html', img: 'images/v-class-london.jpg', eyebrow: 'VIP Transfer', title: 'Premium transfers in Mercedes-Benz vans and saloons', text: 'Professional chauffeurs, carefully maintained vehicles and optional security escorts.', cta: 'The fleet →' }
      ],
      values: [
        { n: 'i.', title: 'Professionalism', text: 'A responsible approach, impeccable presentation and ongoing training.' },
        { n: 'ii.', title: 'Experience', text: 'Personnel experienced in security services and VIP client care.' },
        { n: 'iii.', title: 'Absolute confidentiality', text: 'Confidentiality regarding your identity, schedule and movements.' }
      ]
    };
  }
}

</script>
</body>
</html>
