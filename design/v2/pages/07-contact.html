body{margin:0}
html{color-scheme: dark; accent-color: #CFA45F}
*{-webkit-tap-highlight-color: transparent}

a{color:#E7C687}a:hover{color:#F4F0E6}

.display em{font-style:italic;color:#E7C687}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 30px;box-sizing:border-box;font-family:'Jost',sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid #E7C687;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease}

.card{transition:transform .35s ease,border-color .35s ease}

.zoom .ph{transition:transform .9s ease}

.tab{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:64px;padding:0 4px 0 0;background:transparent;border:0;border-bottom:1px solid rgba(207,164,95,.25);font-family:'Playfair Display',serif;font-size:26px;color:#8E887B;cursor:pointer;text-align:left;transition:color .2s}
.tab:hover{color:#F4F0E6}
.burger{display:none}
.field{display:flex;flex-direction:column;gap:4px;padding:14px 18px;box-sizing:border-box;border-right:1px solid rgba(207,164,95,.22)}

.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:30px;background:transparent;border:0;padding:0;color:#F4F0E6;font-family:'Jost',sans-serif;font-size:17px;text-align:left;cursor:pointer}

<script type="text/plain" id="dc-logic">class Component extends DCLogic {
  dd(k, opts) {
    const st = this.state || {}, cur = st[k + 'V'] || opts[0], o = {};
    o[k + '_value'] = cur; o[k + '_open'] = !!st[k + 'O'];
    o[k + '_toggle'] = () => this.setState({ [k + 'O']: !st[k + 'O'] });
    o[k + '_options'] = opts.map(x => ({ label: x, mark: x === cur ? '✓' : '', pick: () => this.setState({ [k + 'V']: x, [k + 'O']: false }) }));
    return o;
  }
  renderVals() {
    const st = this.state || {};
    return Object.assign({
      navOpen: !!st.navOpen,
      toggleNav: () => this.setState({ navOpen: !st.navOpen }),
      anyOpen: !!st.topicO,
      closeAll: () => this.setState({ topicO: false })
    }, this.dd('topic', ['VIP Transfer', 'VIP Security', 'An existing booking', 'Something else']));
  }
}

</script>
